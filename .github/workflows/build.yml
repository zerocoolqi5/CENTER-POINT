name: build-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file exe
        run: dotnet publish CP/CenterPoint.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Write version file
        shell: bash
        run: echo "${GITHUB_REF_NAME#v}" > publish/version.txt

      - name: Compute SHA-256 fingerprint
        shell: pwsh
        run: |
          $h = (Get-FileHash publish/CenterPoint-Transfer.exe -Algorithm SHA256).Hash.ToLower()
          "$h  CenterPoint-Transfer.exe" | Out-File -FilePath publish/CenterPoint-Transfer.exe.sha256 -Encoding ascii -NoNewline
          Write-Host "SHA-256: $h"

      - name: Package full zip (exe + ui)
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "CenterPoint-Transfer-${{ github.ref_name }}.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CENTER POINT ${{ github.ref_name }}
          files: |
            publish/CenterPoint-Transfer.exe
            publish/CenterPoint-Transfer.exe.sha256
            publish/version.txt
            CenterPoint-Transfer-${{ github.ref_name }}.zip
